name: CI

on:
  push:
    branches: [main, oss]
  pull_request:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 只用 3.11：代码用了 `X | None`，Python 3.9 + Pydantic v2 会崩
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run engine tests + coverage
        # 不加 --timeout：部分集成测试（quality_gate_retry 等）跑 2-3 分钟，60s 会误杀
        run: python -m pytest tests/ -p no:warnings --tb=short --cov=core --cov-report=json:/tmp/cov.json
        env:
          DATABASE_PATH: /tmp/ci_test.db
          AUTH_ENABLED: "false"

      - name: Generate coverage badge
        run: python - <<'EOF'
          import json, os
          cov = json.load(open('/tmp/cov.json'))['totals']['percent_covered']
          color = ('brightgreen' if cov >= 90 else 'green' if cov >= 75
                   else 'yellowgreen' if cov >= 60 else 'yellow' if cov >= 40 else 'red')
          os.makedirs('badges', exist_ok=True)
          json.dump({'schemaVersion': 1, 'label': 'coverage', 'message': f'{cov:.1f}%', 'color': color},
                    open('badges/coverage.json', 'w'))
          print(f'coverage {cov:.1f}% -> {color}')
        EOF

      - name: Commit coverage badge
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.json
          if git diff --cached --quiet; then
            echo "coverage badge unchanged"
          else
            git commit -m "chore: update coverage badge [skip ci]"
            git push origin oss
          fi
